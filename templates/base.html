<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090909] text-[#F3F4F6]">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pressure OS{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                400: '#C9A961',
                500: '#B68A37',
              },
              panel: '#111111',
              panelAlt: '#161616',
              border: '#262626',
              textPrimary: '#F3F4F6',
              textMuted: '#9CA3AF',
              danger: '#EF4444',
            }
          }
        }
      }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: Inter, "SF Pro Display", "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090909;
        color: #F3F4F6;
        letter-spacing: -0.01em;
      }
      * { scrollbar-color: #262626 #090909; }
      ::-webkit-scrollbar { width: 12px; }
      ::-webkit-scrollbar-track { background: #090909; }
      ::-webkit-scrollbar-thumb { background: #262626; border-radius: 999px; }
      input, textarea, select, button {
        font: inherit;
      }
      input, textarea, select {
        width: 100%;
        background: #111111;
        border: 1px solid #262626;
        border-radius: 0.9rem;
        color: #F3F4F6;
        padding: 0.8rem 0.95rem;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      input:focus, textarea:focus, select:focus {
        border-color: #C9A961;
        box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.12);
        background: #161616;
      }
      button {
        cursor: pointer;
      }
      .glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .hud-panel { background: #111111; border: 1px solid #262626; }
      .hud-subtle { background: #161616; border: 1px solid #262626; }
      .mono-numbers { font-variant-numeric: tabular-nums; }
      @keyframes heartbeat { 0%, 100% { border-color: rgba(38, 38, 38, 0.95); } 50% { border-color: rgba(239, 68, 68, 0.72); } }
      .pressured-border { animation: heartbeat 2.8s ease-in-out infinite; }
      .flatpickr-calendar {
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 1rem;
        box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      }
      .flatpickr-calendar .flatpickr-months .flatpickr-month,
      .flatpickr-calendar .flatpickr-weekday,
      .flatpickr-calendar .flatpickr-day {
        color: #F3F4F6;
      }
      .flatpickr-calendar .flatpickr-day:hover,
      .flatpickr-calendar .flatpickr-day.today:hover {
        background: rgba(201, 169, 97, 0.2);
        border-color: rgba(201, 169, 97, 0.7);
      }
      .flatpickr-calendar .flatpickr-day.today {
        border-color: rgba(201, 169, 97, 0.75);
        background: rgba(201, 169, 97, 0.12);
        color: #F3F4F6;
      }
      .flatpickr-calendar .flatpickr-day.selected {
        background: #C9A961;
        border-color: #C9A961;
        color: #090909;
        font-weight: 700;
      }
      .flatpickr-calendar .flatpickr-day.disabled,
      .flatpickr-calendar .flatpickr-day.disabled:hover {
        color: rgba(156, 163, 175, 0.5);
        background: transparent;
      }
      .flatpickr-calendar .flatpickr-nav,
      .flatpickr-calendar .flatpickr-months .flatpickr-prev-month,
      .flatpickr-calendar .flatpickr-months .flatpickr-next-month {
        color: #F3F4F6;
      }
      .flatpickr-calendar .flatpickr-months .flatpickr-prev-month:hover,
      .flatpickr-calendar .flatpickr-months .flatpickr-next-month:hover {
        background: rgba(255,255,255,0.06);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        flatpickr('[data-flatpickr="true"]', {
          altInput: false,
          dateFormat: 'Y-m-d',
          minDate: 'today',
          disableMobile: true,
          monthSelectorType: 'static',
          showMonths: 1,
          allowInput: false,
          animate: true,
          clickOpens: true,
          prevArrow: '←',
          nextArrow: '→'
        });
      });
    </script>
  </head>
  <body class="min-h-full bg-[#090909] text-[#F3F4F6] theme-{{ pressure_theme|default:'default' }}">
    <div class="min-h-screen px-4 py-4 sm:px-6 lg:px-8">
      <div class="mx-auto flex max-w-[1600px] flex-col overflow-hidden rounded-[28px] border border-[#262626] bg-[#0D0D0D] shadow-[0_20px_120px_rgba(0,0,0,0.5)] {{ pressure_shell_class }}">
        {% include "partials/navbar.html" %}
        <div class="flex flex-col lg:flex-row">
          {% include "partials/sidebar.html" %}
          <main class="flex-1 p-4 sm:p-6 lg:p-8">
            {% if messages %}
              <div class="mb-6 space-y-3">
                {% for message in messages %}
                  <div class="rounded-2xl border border-[#262626] bg-[#111111] px-4 py-3 text-sm text-[#F3F4F6]">
                    {{ message }}
                  </div>
                {% endfor %}
              </div>
            {% endif %}
            {% block content %}{% endblock %}
          </main>
        </div>
        {% include "partials/footer.html" %}
      </div>
    </div>
  </body>
</html>
