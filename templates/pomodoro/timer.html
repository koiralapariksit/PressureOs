{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-3xl py-12">
  <section class="rounded-[1.75rem] border border-[#262626] bg-[#111111] p-6 text-center">
    <p class="text-[0.62rem] uppercase tracking-[0.38em] text-[#C9A961]">Operator timer</p>
    <h2 class="mt-2 text-2xl font-semibold text-[#F3F4F6]">Pomodoro Timer</h2>
    <p class="mt-2 text-sm text-[#9CA3AF]">25/5 by default. Create custom modes and track focus.</p>

    <div class="mt-6 flex items-center justify-center">
      <div id="timerRing" class="relative h-64 w-64">
        <svg viewBox="0 0 100 100" class="h-full w-full">
          <defs>
            <linearGradient id="grad" x1="0" x2="1">
              <stop offset="0%" stop-color="#C9A961"/>
              <stop offset="100%" stop-color="#EF4444"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="45" stroke="#262626" stroke-width="10" fill="none"/>
          <circle id="progressCircle" cx="50" cy="50" r="45" stroke="url(#grad)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 50 50)" style="transition: stroke-dashoffset 0.8s cubic-bezier(.22,.9,.34,1);"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="timeDisplay" class="text-4xl font-mono text-[#F3F4F6]">25:00</div>
          <div class="mt-3 flex flex-wrap items-center justify-center gap-2">
            <button id="startBtn" class="rounded-full border border-[#10B981]/40 bg-[#081410] px-4 py-2 text-sm text-[#A7F3D0]">Start</button>
            <button id="stopBtn" class="rounded-full border border-[#EF4444]/40 bg-[#1B0A0A] px-4 py-2 text-sm text-[#FCA5A5]">Stop</button>
            <button id="interruptBtn" class="rounded-full border border-[#C9A961]/40 bg-[#161616] px-3 py-2 text-sm text-[#C9A961]">Interrupt</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap items-center justify-center gap-4 text-sm text-[#D1D5DB]">
      <label>Mode: <input id="modeInput" class="ml-2" value="pomodoro"></label>
      <label>Minutes: <input id="minutesInput" type="number" min="1" value="25" class="ml-2 w-20"></label>
      <label>Long break minutes: <input id="longBreakInput" type="number" min="1" value="15" class="ml-2 w-20"></label>
      <label>Rounds until long break: <input id="roundsInput" type="number" min="1" value="4" class="ml-2 w-20"></label>
    </div>

    <div class="mt-6 text-sm text-[#9CA3AF]" id="dailySummary" aria-live="polite" aria-atomic="true">Loading daily totals…</div>
    <div id="toast" class="fixed bottom-8 right-8 rounded-full border border-[#262626] bg-[#111111] px-4 py-2 text-sm text-[#F3F4F6] opacity-0 transition-opacity duration-300" role="status" aria-live="polite"></div>
    <div id="helpOverlay" class="fixed inset-0 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
      <div class="max-w-lg rounded-[1.5rem] border border-[#262626] bg-[#111111] p-6 text-left text-[#F3F4F6]">
        <h3 class="text-lg font-semibold">Keyboard Shortcuts</h3>
        <ul class="mt-3 space-y-2 text-sm text-[#D1D5DB]">
          <li><strong class="text-[#F3F4F6]">Space</strong>: Start / Stop</li>
          <li><strong class="text-[#F3F4F6]">I</strong>: Record Interrupt</li>
          <li><strong class="text-[#F3F4F6]">H</strong>: Toggle this help</li>
        </ul>
        <div class="mt-4 text-right"><button id="closeHelp" class="rounded-full border border-[#262626] bg-[#161616] px-3 py-1 text-sm text-[#F3F4F6]">Close</button></div>
      </div>
    </div>
  </section>
</div>

<script>
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

function csrfFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, { 'X-CSRFToken': csrftoken });
  return fetch(url, opts);
}

let sessionId = null;
let timer = null;
let remaining = 25*60;
let completedRounds = parseInt(localStorage.getItem('pomodoro_rounds')||'0');

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function updateRing(){
  const circle = document.getElementById('progressCircle');
  const total = parseInt(document.getElementById('minutesInput').value) * 60;
  const pct = Math.max(0, Math.min(1, remaining/total));
  const dash = 283 * (1 - pct);
  circle.style.strokeDashoffset = dash;
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerText = msg;
  t.classList.remove('opacity-0');
  setTimeout(()=> t.classList.add('opacity-0'), 2500);
}

function completePomodoro(){
  completedRounds += 1;
  localStorage.setItem('pomodoro_rounds', String(completedRounds));
  const roundsNeeded = parseInt(document.getElementById('roundsInput').value)||4;
  if(completedRounds % roundsNeeded === 0){
    // start long break automatically
    const longMin = parseInt(document.getElementById('longBreakInput').value)||15;
    document.getElementById('minutesInput').value = longMin;
    showToast('Starting long break — relax');
    startTimer();
  } else {
    showToast('Pomodoro complete — short break suggested');
  }
}

function tick(){
  if(remaining>0){
    remaining -=1;
    document.getElementById('timeDisplay').innerText = formatTime(remaining);
    updateRing();
  } else {
    stopTimer(true);
    completePomodoro();
  }
}

function startTimer(){
  const mins = parseInt(document.getElementById('minutesInput').value) || 25;
  remaining = mins*60;
  document.getElementById('timeDisplay').innerText = formatTime(remaining);
  csrfFetch('/pomodoro/api/start/', { method: 'POST', body: new URLSearchParams({mode: document.getElementById('modeInput').value}) })
    .then(r=>r.json()).then(data=>{ sessionId = data.id; });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 1000);
  showToast('Timer started');
}

function stopTimer(finished=false){
  if(timer) clearInterval(timer);
  timer = null;
  if(sessionId){
    csrfFetch('/pomodoro/api/stop/', { method: 'POST', body: new URLSearchParams({id: sessionId}) })
      .then(r=>r.json()).then(()=>{ sessionId = null; fetchDaily(); });
  }
}

function recordInterrupt(){
  if(!sessionId) return;
  csrfFetch('/pomodoro/api/interrupt/', { method: 'POST', body: new URLSearchParams({id: sessionId}) })
    .then(r=>r.json()).then(()=>{ fetchDaily(); showToast('Interrupt recorded'); });
}

function fetchDaily(){
  fetch('/pomodoro/api/daily/').then(r=>r.json()).then(data=>{
    const mins = Math.round((data.total_seconds||0)/60);
    const el = document.getElementById('dailySummary');
    if(el) el.innerText = `Today: ${mins}m across ${data.completed} sessions — Interruptions: ${data.interruptions} — Focus score: ${data.focus_score}`;
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('startBtn').addEventListener('click', startTimer);
  document.getElementById('stopBtn').addEventListener('click', ()=>stopTimer(false));
  document.getElementById('interruptBtn').addEventListener('click', recordInterrupt);
  document.getElementById('closeHelp').addEventListener('click', ()=>{ const o = document.getElementById('helpOverlay'); o.classList.add('hidden'); o.classList.remove('flex'); });
  fetchDaily();
});

// keyboard shortcuts and ARIA announcements
document.addEventListener('keydown', (e)=>{
  // toggle help
  if(e.code === 'KeyH'){
    const o = document.getElementById('helpOverlay');
    if(o.classList.contains('hidden')){ o.classList.remove('hidden'); o.classList.add('flex'); }
    else { o.classList.add('hidden'); o.classList.remove('flex'); }
  }
  // space toggles start/stop
  if(e.code === 'Space'){
    e.preventDefault();
    if(timer) stopTimer(false); else startTimer();
  }
  // 'KeyI' for interrupt
  if(e.code === 'KeyI'){
    e.preventDefault();
    recordInterrupt();
  }
});
</script>

{% endblock %}
