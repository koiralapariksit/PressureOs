{% load static %}
<div class="rounded-[1.25rem] border border-[#262626] bg-[#161616] p-5 transition-colors duration-500 {{ panel_class|default:'' }}">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-[0.62rem] uppercase tracking-[0.42em] text-[#9CA3AF]">{{ title }}</p>
      <p class="mono-numbers mt-3 text-2xl font-semibold {{ accent_class|default:'text-[#F3F4F6]' }}">{{ value }}</p>
    </div>
    {% if icon %}
      <div class="rounded-2xl border border-[#262626] bg-[#111111] p-3 text-[#C9A961]">{{ icon }}</div>
    {% endif %}
  </div>
  {% if subtitle %}
    <p class="mt-3 text-sm {{ muted_class|default:'text-[#9CA3AF]' }}">{{ subtitle }}</p>
  {% endif %}
</div>
