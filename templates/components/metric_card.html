{% load static %}
<div class="rounded-[1.5rem] border border-white/10 bg-white/5 p-5 shadow-[0_10px_35px_rgba(0,0,0,0.25)] transition-colors duration-500 {{ panel_class|default:'' }}">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-[0.65rem] uppercase tracking-[0.4em] text-slate-400">{{ title }}</p>
      <p class="mt-3 text-2xl font-semibold {{ accent_class|default:'text-white' }}">{{ value }}</p>
    </div>
    {% if icon %}
      <div class="rounded-2xl border border-gold-400/20 bg-gold-400/10 p-3 text-gold-400">{{ icon }}</div>
    {% endif %}
  </div>
  {% if subtitle %}
    <p class="mt-3 text-sm {{ muted_class|default:'text-slate-400' }}">{{ subtitle }}</p>
  {% endif %}
</div>
