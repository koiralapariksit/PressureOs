{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-[2rem] border border-white/10 bg-black/60 p-8 shadow-[0_30px_120px_rgba(0,0,0,0.55)] backdrop-blur-xl">
  <div class="mb-8">
    <p class="text-xs uppercase tracking-[0.45em] text-gold-400">Create account</p>
    <h1 class="mt-3 text-3xl font-semibold text-white">Register your identity</h1>
    <p class="mt-3 text-slate-400">A clean start. A serious commitment.</p>
  </div>

  <form method="post" class="space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="mb-2 block text-sm text-slate-300" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="mt-2 text-sm text-red-200">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full rounded-full border border-red-500/40 bg-red-600/20 px-5 py-3 text-sm font-medium text-red-100 transition hover:bg-red-600/30">Create account</button>
  </form>
</div>
{% endblock %}
