{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-[1.75rem] border border-[#262626] bg-[#111111] p-8">
  <div class="mb-8">
    <p class="text-[0.62rem] uppercase tracking-[0.38em] text-[#C9A961]">Create account</p>
    <h1 class="mt-3 text-3xl font-semibold text-[#F3F4F6]">Register your identity</h1>
    <p class="mt-3 text-[#9CA3AF]">A clean start. A serious commitment.</p>
  </div>

  <form method="post" class="space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="mb-2 block text-sm text-[#D1D5DB]" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="mt-2 text-sm text-[#FCA5A5]">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full rounded-full border border-[#C9A961]/60 bg-[#161616] px-5 py-3 text-sm font-medium text-[#C9A961] transition hover:border-[#F3F4F6] hover:text-[#F3F4F6]">Create account</button>
  </form>
</div>
{% endblock %}
