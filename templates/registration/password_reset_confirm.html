{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-[2rem] border border-white/10 bg-black/60 p-8 shadow-[0_30px_120px_rgba(0,0,0,0.55)] backdrop-blur-xl">
  <p class="text-xs uppercase tracking-[0.45em] text-gold-400">Set new password</p>
  <h1 class="mt-3 text-3xl font-semibold text-white">Choose a new password</h1>
  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="mb-2 block text-sm text-slate-300" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <button type="submit" class="w-full rounded-full border border-red-500/40 bg-red-600/20 px-5 py-3 text-sm font-medium text-red-100 transition hover:bg-red-600/30">Save password</button>
  </form>
</div>
{% endblock %}
