{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-[2rem] border border-white/10 bg-black/60 p-8 shadow-[0_30px_120px_rgba(0,0,0,0.55)] backdrop-blur-xl">
  <p class="text-xs uppercase tracking-[0.45em] text-gold-400">Reset access</p>
  <h1 class="mt-3 text-3xl font-semibold text-white">Recover your password</h1>
  <p class="mt-3 text-slate-400">Enter the email tied to your account and the reset instructions will be sent.</p>

  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <div>
      <label class="mb-2 block text-sm text-slate-300" for="id_email">{{ form.email.label }}</label>
      {{ form.email }}
    </div>
    <button type="submit" class="w-full rounded-full border border-red-500/40 bg-red-600/20 px-5 py-3 text-sm font-medium text-red-100 transition hover:bg-red-600/30">Send reset link</button>
  </form>
</div>
{% endblock %}
