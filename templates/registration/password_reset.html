{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-[1.75rem] border border-[#262626] bg-[#111111] p-8">
  <p class="text-[0.62rem] uppercase tracking-[0.38em] text-[#C9A961]">Reset access</p>
  <h1 class="mt-3 text-3xl font-semibold text-[#F3F4F6]">Recover your password</h1>
  <p class="mt-3 text-[#9CA3AF]">Enter the email tied to your account and the reset instructions will be sent.</p>

  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <div>
      <label class="mb-2 block text-sm text-[#D1D5DB]" for="id_email">{{ form.email.label }}</label>
      {{ form.email }}
    </div>
    <button type="submit" class="w-full rounded-full border border-[#C9A961]/60 bg-[#161616] px-5 py-3 text-sm font-medium text-[#C9A961] transition hover:border-[#F3F4F6] hover:text-[#F3F4F6]">Send reset link</button>
  </form>
</div>
{% endblock %}
